<style>
:root{
  --bg:#EEF3EA; --surface:#FFFFFF; --surface-2:#EFF5EB; --ink:#1A2A1F; --muted:#5F6E63; --line:#D5E2CE;
  --tape:#2F6B3F; --tape-soft:#DDEBD5; --tape-ink:#FFFFFF; --tape-hi:#A8D98F;
  --st0:#C08A2E; --st1:#2E7D8F; --st2:#C8643B; --st3:#7A5CA8; --st4:#2F7A45;
  --st0s:#F6EBD6; --st1s:#DCEFF2; --st2s:#F7E1D7; --st3s:#E9E2F4; --st4s:#DDEFE1;
  --deep:#1E3B2A; --deep-2:#2A5238; --moss:#6E9B5A; --sand:#F4EEE2; --sand-ink:#7A5B34; --wood:#C99F6F; --piece:#FFFFFF; --piece-line:#17191C;
  --danger:#C8372D; --danger-soft:#FBE7E5; --ok:#2F8A57; --ok-soft:#E3F3EA; --blue:#3A74D8; --orange:#E0802E;
  --shadow:0 1px 2px rgba(23,25,28,.06), 0 6px 20px rgba(23,25,28,.06);
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --sans:"Figtree", "Segoe UI", Roboto, Arial, sans-serif;
  --num:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#18201A; --surface-2:#202A22; --ink:#EEEFEC; --muted:#9BA1A6; --line:#2F3337;
    --st0s:#3A2E17; --st1s:#16343A; --st2s:#3B2219; --st3s:#2C2440; --st4s:#183121; --tape:#3F8A52; --tape-soft:#1C3222; --tape-hi:#A8D98F; --deep:#2A5238; --deep-2:#356543; --moss:#8DBB77; --sand:#2B2A22; --sand-ink:#D9BE92; --wood:#8A6A45; --piece:#E9E6DE; --piece-line:#111315; --danger:#F08378; --danger-soft:#3A1F1C; --ok:#6FCF97; --ok-soft:#18301F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#18201A; --surface-2:#202A22; --ink:#EEEFEC; --muted:#9BA1A6; --line:#2F3337;
  --st0s:#3A2E17; --st1s:#16343A; --st2s:#3B2219; --st3s:#2C2440; --st4s:#183121; --tape:#3F8A52; --tape-soft:#1C3222; --tape-hi:#A8D98F; --deep:#2A5238; --deep-2:#356543; --moss:#8DBB77; --sand:#2B2A22; --sand-ink:#D9BE92; --wood:#8A6A45; --piece:#E9E6DE; --piece-line:#111315; --danger:#F08378; --danger-soft:#3A1F1C; --ok:#6FCF97; --ok-soft:#18301F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.m{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.muted{color:var(--muted)}
.ic{flex:none}
main{max-width:880px;margin:0 auto;padding:0 16px 120px}

/* Barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.3px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--tape);display:grid;place-items:center;color:var(--tape-ink)}
.logo.ef{width:40px;height:40px;font-weight:800;font-size:14px;letter-spacing:.3px}
.brand-t{display:flex;flex-direction:column;line-height:1.05;font-size:19px;white-space:nowrap}
.brand-t small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync[data-s="busy"] i{background:var(--tape)}
.sync[data-s="err"] i{background:var(--danger)}
.sync[data-s="local"] i{background:var(--muted)}
.page-title{font-weight:800;font-size:22px;letter-spacing:-.3px;margin-right:auto}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ptitle{flex:1;min-width:0;border:0;background:transparent;font-weight:800;font-size:20px;letter-spacing:-.3px;padding:8px 6px;border-radius:10px}
.ptitle:focus{outline:none;background:var(--surface)}
.ptitle::placeholder{color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--deep);color:#fff;flex:none}
.pill.tape{background:var(--tape);color:var(--tape-ink)}
.pill.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Cartão de resumo com régua */
.hero{position:relative;overflow:hidden;background:var(--tape);color:var(--tape-ink);border-radius:var(--r-lg);padding:18px 18px 30px;margin-top:4px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.8) 0 1.5px, transparent 1.5px 60px) bottom/100% 14px no-repeat,
    repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px 12px) bottom/100% 7px no-repeat}
.hero .lbl{font-size:14px;font-weight:600;opacity:.8}
.hero .val{font-family:var(--num);font-weight:700;font-size:44px;line-height:1.05}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.hero-stats span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}
.hero-stats .bad{background:var(--ink);color:var(--tape-hi)}

/* Segmentos */
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 10px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--tape);color:#fff}
.seg .cnt{background:var(--tape-soft);color:var(--tape)}
.seg button[aria-selected="true"] .cnt,.seg button[aria-pressed="true"] .cnt{background:rgba(255,255,255,.22);color:#fff}
.seg .cnt{font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 7px;line-height:18px}
.seg [aria-selected="true"] .cnt{background:rgba(255,255,255,.2);color:inherit}
.section-gap{margin-top:18px}

/* Cartões de projeto */
.cards{display:grid;gap:12px;margin-top:14px}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.pcard{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.pcard:hover{transform:translateY(-1px)}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-name{font-weight:700;font-size:18px;letter-spacing:-.2px;line-height:1.2}
.pc-client{color:var(--muted);font-size:15px;margin-top:2px}
.due{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.due.soon{background:var(--tape-soft);color:var(--ink)}
.due.late{background:var(--danger-soft);color:var(--danger)}
.due.done{background:var(--ok-soft);color:var(--ok)}
.stagebar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 6px}
.stagebar i{height:6px;border-radius:3px;background:var(--line)}
.stagebar i:nth-child(1).on,.stagebar i:nth-child(1).cur{background:var(--st0)}
.stagebar i:nth-child(2).on,.stagebar i:nth-child(2).cur{background:var(--st1)}
.stagebar i:nth-child(3).on,.stagebar i:nth-child(3).cur{background:var(--st2)}
.stagebar i:nth-child(4).on,.stagebar i:nth-child(4).cur{background:var(--st3)}
.stagebar i:nth-child(5).on,.stagebar i:nth-child(5).cur{background:var(--st4)}
.st-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 10px}
.st-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sb-0{background:var(--st0s);color:var(--st0)}.sb-1{background:var(--st1s);color:var(--st1)}.sb-2{background:var(--st2s);color:var(--st2)}.sb-3{background:var(--st3s);color:var(--st3)}.sb-4{background:var(--st4s);color:var(--st4)}
.pc-foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.pc-foot b{color:var(--ink);font-weight:700}

/* Vazio */
.empty{text-align:center;padding:40px 12px}
.empty svg{margin-bottom:10px}
.empty h2{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
.empty p{color:var(--muted);max-width:360px;margin:0 auto 18px}

/* Navegação inferior */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;background:var(--deep);color:var(--bg);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bottomnav button{border:0;background:transparent;color:inherit;opacity:.65;display:flex;align-items:center;gap:6px;padding:10px 13px;border-radius:999px;font-weight:600;white-space:nowrap}
@media (max-width:420px){.bottomnav{max-width:calc(100vw - 20px);gap:2px}.bottomnav button{padding:10px 10px;font-size:14.5px;gap:5px}.bottomnav .ic{width:16px;height:16px}}
.bottomnav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12)}
.bottomnav button[data-nav="inicio"]{opacity:1;padding:10px 20px}
.bottomnav .fab{background:var(--tape);color:var(--tape-ink);opacity:1;padding:10px 14px;font-weight:700}
.bottomnav[hidden]{display:none}
.fab-float{position:fixed;right:max(16px, calc(50% - 704px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--tape);color:var(--tape-ink);display:flex;align-items:center;gap:8px;padding:15px 20px;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.22)}

/* Cabeçalho do projeto */
.phero{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-top:4px;border-top:5px solid var(--tape)}
.client-line{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--tape-soft);display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none}
.client-line .who{flex:1;min-width:0}
.client-line .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client-line .sub{font-size:14px;color:var(--muted)}
.wa{width:40px;height:40px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);margin-top:16px}
.step{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center}
.step::before{content:"";position:absolute;top:9px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .dot{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center}
.step{--c:var(--tape)}
.step:nth-child(1){--c:var(--st0)}.step:nth-child(2){--c:var(--st1)}.step:nth-child(3){--c:var(--st2)}.step:nth-child(4){--c:var(--st3)}.step:nth-child(5){--c:var(--st4)}
.step.done::before,.step.cur::before{background:var(--c)}
.step.done .dot{background:var(--c);border-color:var(--c);color:#fff}
.step.cur .dot{background:var(--c);border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.step.cur{color:var(--c)}
.step.done{color:var(--ink)}
.step.cur{font-weight:800}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--bg);padding:12px 0 10px;margin-top:6px}
.ptabs .seg button{padding:9px 6px;font-size:14px}
@media (max-width:420px){.ptabs .seg .ic{display:none}}

/* Cartões e campos */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--tape)}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.fields>*{min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-width:0;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px 12px;font-size:16px;color:var(--ink)}
.in:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea.in{resize:vertical;min-height:70px}
.unit{position:relative}
.unit .in{padding-right:40px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.in.big{font-family:var(--num);font-size:24px;font-weight:600;padding:8px 12px}
.withbtn{display:flex;gap:8px}

.fin-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.fin-top .lbl{font-size:14px;color:var(--muted);font-weight:600}
.fin-top .val{font-family:var(--num);font-size:38px;font-weight:700;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.bar-cap{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.pays{list-style:none;margin:10px 0 0;padding:0}
.pays li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pays .ck{width:28px;height:28px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.pays .d{flex:1;color:var(--muted);font-size:14px}
.pays b{font-family:var(--num);font-size:19px}
.mini-x{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.mini-x:hover{color:var(--danger)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--moss);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--num);font-size:24px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles.in-card .tile{box-shadow:none;background:var(--surface-2)}
.tiles.two-t{grid-template-columns:1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.dark{background:var(--deep);color:#fff}
.btn.dark:hover{background:var(--deep-2)}
.btn.tape{background:var(--tape);color:var(--tape-ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger)}
.danger-zone{text-align:center;margin-top:18px}

/* Lista de peças e materiais */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rowc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.rowc .body{flex:1;min-width:0}
.rowc .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowc .s{font-size:14px;color:var(--muted)}
.rowc .dims{display:block;font-family:var(--num);font-size:21px;font-weight:600;line-height:1.2}
.rowc .dims small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500}
.rowc .qty{font-family:var(--num);font-weight:700;font-size:18px;color:var(--tape);background:var(--tape-soft);border-radius:999px;padding:2px 11px;flex:none}
.rowc .right{text-align:right;flex:none}
.rowc .right .v{font-family:var(--num);font-size:20px;font-weight:700}
.mini{flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--surface-2);border-radius:10px}
.hint{display:flex;align-items:center;gap:12px;background:var(--tape-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:14px}
.hint .t{flex:1;font-size:15px}

/* Plano de corte */
.sheets{display:grid;gap:14px;margin-top:14px}
@media (min-width:700px){.sheets{grid-template-columns:1fr 1fr}}
.sheet{background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow)}
.sheet svg{width:100%;height:auto;display:block;border-radius:6px}
.sheet .cap{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px;font-weight:600}
.sheet-bg{fill:var(--wood)}
.pc{fill:var(--piece);stroke:var(--piece-line);stroke-width:5}
.pc-box{fill:var(--piece);fill-opacity:.28;stroke:var(--piece-line);stroke-width:3;stroke-dasharray:14 10}
.pc-t{fill:#17191C;font-family:var(--num);font-weight:600}
.mat-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.mat-title h3{margin:0;font-size:17px;font-weight:800}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-md);padding:10px 12px;font-weight:600;margin-top:10px;font-size:15px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Clientes */
.clist{display:grid;gap:10px;margin-top:10px}
@media (min-width:700px){.clist{grid-template-columns:1fr 1fr}}
.ccard{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.ccard .projs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-0 i{background:var(--st0)}.st-1 i{background:var(--st1)}.st-2 i{background:var(--st2)}.st-3 i{background:var(--st3)}.st-4 i{background:var(--st4)}

/* Folha inferior (diálogo) */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;border-radius:22px 22px 0 0;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(10,12,14,.5)}
@media (min-width:700px){dialog{border-radius:22px;margin:auto}}
.sheet-in{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media (min-width:700px){.grab{display:none}.sheet-in{padding-top:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--ink)}
.stepperq{display:flex;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);height:48px}
.stepperq button{width:48px;height:48px;border:0;background:transparent;font-size:22px;font-weight:700}
.stepperq input{flex:1;min-width:0;text-align:center;border:0;background:transparent;font-family:var(--num);font-size:24px;font-weight:700}
.stepperq input:focus{outline:none}
.fitabox{background:var(--surface-2);border-radius:var(--r-md);padding:26px 30px;display:flex;justify-content:center}
.fitarect{position:relative;background:var(--piece);border:1.5px solid var(--muted);width:100%;max-width:300px;display:grid;place-items:center;text-align:center;border-radius:2px}
.fitarect .dimt{font-family:var(--num);font-size:20px;font-weight:600;color:#17191C;line-height:1.1}
.fitarect .dimt small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:#6A6F74}
.edge{position:absolute;border:0;padding:0;background:transparent}
.edge::after{content:"";position:absolute;background:transparent;border:2px dashed var(--muted);opacity:.45;border-radius:3px;transition:background .15s}
.edge:hover::after{opacity:.9}
.edge.on::after{background:var(--tape);border:1.5px solid var(--ink);opacity:1}
.edge.t,.edge.b{left:-6px;right:-6px;height:26px}
.edge.t{top:-20px}.edge.b{bottom:-20px}
.edge.t::after,.edge.b::after{left:6px;right:6px;height:7px}
.edge.t::after{bottom:7px}.edge.b::after{top:7px}
.edge.l,.edge.r{top:-6px;bottom:-6px;width:26px}
.edge.l{left:-20px}.edge.r{right:-20px}
.edge.l::after,.edge.r::after{top:6px;bottom:6px;width:7px}
.edge.l::after{right:7px}.edge.r::after{left:7px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-md);cursor:pointer}
.switch .txt b{display:block;font-size:15px}
.switch .txt span{font-size:13px;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--tape)}
.switch input:checked::after{left:21px}
.sheet-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}
.linkrow{display:flex;justify-content:space-between;margin-top:8px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface-2);border-radius:var(--r-md);padding:14px;margin-top:8px}
.choice .ico{width:42px;height:42px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.choice.main .ico{background:var(--tape);color:var(--tape-ink)}
.choice b{display:block;font-size:16px}
.choice .d{display:block;font-size:14px;color:var(--muted)}
.dlg-x{width:100%;min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.chapa-edit{background:var(--surface-2);border-radius:var(--r-md);padding:12px;display:grid;gap:10px}
.chapa-edit .in{background:var(--surface)}


/* Assistente */
.assist{background:linear-gradient(160deg,var(--deep-2),var(--deep));color:#EEF5EA;border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.as-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.as-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--tape-hi)}
.un-seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.un-seg button{border:0;background:transparent;color:inherit;opacity:.7;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.un-seg button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);opacity:1}
.as-in{width:100%;border:2px solid transparent;border-radius:var(--r-md);background:#F6FAF3;color:var(--ink);padding:12px 14px;font-size:18px;font-weight:600;resize:none;line-height:1.35;min-height:76px}
.as-in:focus{outline:none;border-color:var(--tape-hi)}
.as-tip{margin:8px 0 0;font-size:13px;opacity:.7}
.as-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.as-ex .chip:hover{border-color:var(--tape)}
.as-msg{margin:12px 0 0;font-size:15px}
.as-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.as-list li{display:flex;align-items:center;gap:10px;background:var(--bg);color:var(--ink);border-radius:var(--r-md);padding:8px 10px}
.as-list .mini{width:40px;height:40px}
.as-b{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.as-b .m{font-size:19px;font-weight:600}

.as-note{margin:10px 0 0;font-size:14px;opacity:.8}
.as-impact{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:var(--tape-hi)}
.as-impact span{color:var(--bg)}
.as-impact em{font-style:normal;color:#F08378}
.as-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.as-actions .btn.tape{flex:1}
.as-actions .btn.ghost{color:inherit;opacity:.8}
.btn.ai{background:rgba(255,255,255,.12);color:inherit}
.as-load{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
.as-load .btn{margin-left:auto;color:inherit}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.25);border-top-color:var(--tape-hi);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* Móvel */
.sec-t{font-size:16px;font-weight:800;margin:22px 0 10px;color:var(--deep)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:700px){.presets{grid-template-columns:repeat(4,minmax(0,1fr))}}
.preset{border:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.preset b{font-size:15px}
.preset .m{font-size:14px;color:var(--muted)}
.show{padding:14px}
.show-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.show-t{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.show-m{font-size:18px;font-weight:600}
.show-i{font-size:14px;color:var(--muted)}
.mini-seg{box-shadow:none;background:var(--surface-2);flex:none}
.mini-seg button{padding:6px 12px;font-size:14px}
.viewer{margin:12px -14px 0;background:radial-gradient(120% 90% at 50% 20%,#FFFFFF 0%,var(--surface-2) 70%,var(--tape-soft) 100%);min-height:240px;display:flex;align-items:center;justify-content:center}
.v3d{width:100%}

#vfront{width:100%;padding:12px}
.vfront{width:100%;max-height:420px;display:block}
.view-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}

.vbtns{display:flex;gap:4px}
.vbtns button{border:0;background:var(--surface-2);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}
.hint-s{font-size:13px;color:var(--muted);margin:8px 0 0}
details.mais{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}

.curva-prev{background:var(--surface-2);border-radius:var(--r-md);padding:10px}
.mv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.mv-a{display:flex;gap:6px;flex:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
a.choice{text-decoration:none;color:inherit}
.grp-t{margin:16px 0 8px;font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--moss)}
.os-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 12px}
.os-tag{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.6px;background:var(--tape);color:#fff;border-radius:8px;padding:3px 10px}
.os-d{font-size:13px;color:var(--muted)}
.os-mini{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--tape)}
.pad-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface-2);border-radius:var(--r-md);padding:8px 12px 8px 8px;margin-top:6px;text-align:left;color:var(--ink)}

.pad-go{font-size:14px;font-weight:700;color:var(--tape)}

.modos{display:grid;gap:8px}

.modo[aria-pressed="true"]{border-color:var(--tape);background:var(--tape-soft)}
.modo-h{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.modo-ok{width:22px;height:22px;border-radius:50%;background:var(--tape);color:#fff;display:grid;place-items:center}

.sobra-box{fill:rgba(47,107,63,.10);stroke:var(--tape);stroke-width:6;stroke-dasharray:24 14}
.sobra-t{fill:var(--tape);font-family:var(--num);font-weight:700}
button.brand{border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;color:inherit;text-align:left;cursor:pointer}
.brand-img{width:46px;height:auto;display:block}
.intro{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 18px 18px;margin-top:max(14px,env(safe-area-inset-top,0px));text-align:center;position:relative;overflow:hidden}
.intro::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--tape),#B0703A)}
.intro-logo img{width:min(100%,360px);height:auto;display:block;margin:0 auto}
.intro-hi{margin:14px 0 2px;font-size:18px;font-weight:800;color:#1E3B2A}
.intro-hi span{display:block;font-size:13.5px;font-weight:600;color:#6B7A6E}
.intro-t{margin:8px auto 4px;max-width:34ch;font-size:14.5px;line-height:1.45;color:#56625A}
.os-main{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;border:0;border-radius:var(--r-lg);padding:18px;text-align:left;color:#fff;
  background:linear-gradient(135deg,var(--deep-2),var(--deep));box-shadow:var(--shadow);cursor:pointer}
.os-ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none;color:var(--tape-hi)}
.os-tx{flex:1;display:flex;flex-direction:column;gap:3px}.os-tx b{font-size:20px}.os-tx span{font-size:14px;opacity:.85}.os-tx em{font-style:normal;color:#FFB59A;font-weight:700}
.os-go{font-size:34px;line-height:1;opacity:.7}
.tile .v.sm{font-size:17px;line-height:1.15;white-space:nowrap}
.tile .v.sm .cur{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.prox{display:grid;gap:8px}
.prox-i{display:grid;grid-template-columns:1fr auto;grid-template-areas:"os chip" "n chip" "c chip";align-items:center;text-align:left;border:0;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);color:var(--ink);cursor:pointer}
.prox-i .os-mini{grid-area:os}.prox-i b{grid-area:n;font-size:16px}.prox-i .m{grid-area:c;font-size:13.5px;color:var(--muted)}.prox-i>:last-child{grid-area:chip}
.intro-f{text-align:center;color:var(--muted);font-size:12.5px;margin:22px 0 4px;letter-spacing:.3px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three .in{padding:11px 30px 11px 10px}
.three .unit span{right:8px;font-size:12px}
.cnts{display:grid;gap:8px}
@media (min-width:600px){.cnts{grid-template-columns:1fr 1fr}}
.cnt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:6px 6px 6px 14px;font-weight:600}
.stepperq.sm{height:40px;background:var(--surface);border-radius:999px}
.stepperq.sm button{width:40px;height:40px;font-size:20px}
.stepperq.sm output{min-width:34px;text-align:center;font-size:22px;font-weight:700}
.cores{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.ferr{list-style:none;margin:0;padding:0}
.ferr li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.ferr li:first-child{border-top:0}
.ferr b{font-size:19px}
.chip[aria-pressed="true"]{background:var(--tape);color:#fff;border-color:var(--tape)}
.as-found{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.as-found span{background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.edge::after,.switch input,.switch input::after{transition:none}}

/* ---------- computador: usar a tela inteira ---------- */
@media (min-width:900px){
  main{max-width:1440px;padding:0 32px 120px}
  .appbar{margin:0 -32px;padding-left:32px;padding-right:32px}
  .presets{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
@media (min-width:1100px){
  .cards,.clist{grid-template-columns:repeat(3,minmax(0,1fr))}
  .presets{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sheets{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles{gap:14px}
  /* tela inicial em duas colunas */
  main.v-inicio{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:28px;align-content:start}
  main.v-inicio>*{grid-column:2}
  main.v-inicio>.intro{grid-column:1;grid-row:1 / span 12;align-self:start;position:sticky;top:24px;padding:48px 36px 40px}
  main.v-inicio>.intro .intro-logo img{max-width:440px}
  main.v-inicio>.os-main{margin-top:max(14px,env(safe-area-inset-top,0px))}
  main.v-inicio>.intro-f{grid-column:1 / -1}
  /* aba Móvel: desenho à esquerda, ajustes à direita */
  #corpo.mv{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);column-gap:22px;align-items:start}
  #corpo.mv>*{grid-column:2;min-width:0}
  #corpo.mv>.show{grid-column:1;grid-row:1 / span 30;position:sticky;top:150px;margin-top:0}
  #corpo.mv>:nth-child(2){margin-top:0}
  #corpo.mv .card+.card{margin-top:12px}
  /* aba Cliente: cartões lado a lado */
  main.a-resumo #corpo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  main.a-resumo #corpo .card+.card{margin-top:0}
  main.a-resumo #corpo>.danger-zone{grid-column:1 / -1}
  /* lista de OS: cartões de nuvem e backup lado a lado */
  main.v-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-content:start}
  main.v-lista>*{grid-column:1 / -1}
  main.v-lista>.nuvem,main.v-lista>.backup{grid-column:auto;align-self:stretch}
}
</style>
</head>
<body>
<main id="app"></main>
<nav class="bottomnav" id="bnav" aria-label="Seções">
  <button data-nav="inicio" aria-current="page"></button>
</nav>
<dialog id="dlg"><div class="sheet-in" id="dlg-c"></div></dialog>
<div class="toast" id="toast" role="status"></div>

(function(){
const STATUS=["Orçamento","Aprovado","Em produção","Montagem","Entregue"];
const LKEY="bancada-projetos-v1";
const app=document.getElementById("app");
const S={projetos:new Map(),view:"inicio",atual:null,aba:"resumo",filtro:"Todos",backend:"local",db:null,confirmDel:false};
const timers={},writing={},again={};

/* ---------- utilidades ---------- */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const n2=n=>(Number(n)||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
function parseNum(v){v=String(v??"").trim();if(!v)return 0;if(v.includes(",")){v=v.replace(/\./g,"").replace(",",".");}const n=parseFloat(v);return isFinite(n)?n:0}
const showNum=n=>n?String(n).replace(".",","):"";
const hoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function fmtData(d){if(!d)return"";const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
const clone=o=>JSON.parse(JSON.stringify(o));
const stIdx=s=>Math.max(0,STATUS.indexOf(s));

function novoProjeto(){
  return {nome:"",cliente:"",telefone:"",endereco:"",status:"Orçamento",prazo:"",valor:0,obs:"",
    pagamentos:[],chapas:[{id:uid(),nome:"MDF Branco 15mm",comp:2750,larg:1840}],pecas:[],materiais:[],
    corte:{kerf:4,refilo:10},criado:Date.now(),atualizado:Date.now()};
}
function fmtOS(n){return n?"OS "+String(n).padStart(4,"0"):"OS —";}
function proximaOS(){let m=0;S.projetos.forEach(p=>{m=Math.max(m,Number(p.os)||0);});return m+1;}
function numerarOS(){const sem=[...S.projetos].filter(([,p])=>!(Number(p.os)>0)).sort((a,b)=>(a[1].criado||0)-(b[1].criado||0));
  if(!sem.length)return;let n=proximaOS()-1;sem.forEach(([id,p])=>{p.os=++n;salvar(id);});}
function dataCriado(p){try{return new Date(p.criado||Date.now()).toLocaleDateString("pt-BR");}catch(e){return "";}}
function novaPeca(p){const ult=p.pecas[p.pecas.length-1];return {id:uid(),nome:"",qtd:1,comp:0,larg:0,material:ult?ult.material:p.chapas[0].id,veio:false,fita:{c1:false,c2:false,l1:false,l2:false},curva:"",curvaMm:0}}
function normalizar(p){
  const b=novoProjeto();
  for(const k of Object.keys(b)) if(p[k]===undefined) p[k]=b[k];
  if(!Array.isArray(p.chapas)||!p.chapas.length) p.chapas=b.chapas;
  p.corte=p.corte||b.corte;
  p.pecas.forEach(pc=>{pc.fita=pc.fita||{c1:false,c2:false,l1:false,l2:false}; if(!p.chapas.find(c=>c.id===pc.material)) pc.material=p.chapas[0].id;});
  return p;
}

/* ---------- armazenamento ---------- */
const setSync=t=>{S.syncT=t;S.syncS=/Erro|Sem conex|Limite|Não foi/.test(t)?"err":/Salvando|Sincronizando|Carregando/.test(t)?"busy":/aparelho/.test(t)?"local":"ok";
  document.querySelectorAll("[data-sync]").forEach(el=>{el.dataset.s=S.syncS;el.querySelector("span").textContent=t;});};
function lerLocal(){try{const raw=localStorage.getItem(LKEY);if(raw){const o=JSON.parse(raw);for(const id in o)S.projetos.set(id,normalizar(o[id]));}}catch(e){}}
function gravarLocal(){try{const o={};S.projetos.forEach((v,k)=>o[k]=v);localStorage.setItem(LKEY,JSON.stringify(o));setSync("Salvo só neste aparelho");}catch(e){setSync("Não foi possível salvar neste aparelho");}}
function salvar(id){
  const p=S.projetos.get(id); if(!p)return; p.atualizado=Date.now();
  if(S.backend!=="db"){gravarLocal();return;}
  setSync("Salvando…");
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{delete timers[id];flush(id)},600);
}
async function flush(id){
  if(writing[id]){again[id]=true;return;}
  const p=S.projetos.get(id); if(!p)return;
  writing[id]=true;
  const ref=S.db.collection("projetos").doc(id);
  try{await ref.set(clone(p));setSync("Salvo");}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await ref.set(clone(p));setSync("Salvo");}catch(e2){setSync("Erro ao salvar. Confira a internet.");}}
    else if(e&&e.code==="quota_exceeded"){setSync("Limite de armazenamento atingido");toast("Limite atingido. Exclua projetos antigos.");}
    else setSync("Erro ao salvar. Confira a internet.");
  }
  writing[id]=false;
  if(again[id]){again[id]=false;flush(id);}
}
function flushNow(id){clearTimeout(timers[id]);delete timers[id];flush(id);}
async function excluir(id){
  S.projetos.delete(id);
  if(S.backend==="db"){try{await S.db.collection("projetos").doc(id).delete();setSync("Salvo");}catch(e){setSync("Erro ao excluir. Confira a internet.");}}
  else gravarLocal();
}

function fbConfig(){try{if(localStorage.getItem(FBKEY+"-off"))return null;return JSON.parse(localStorage.getItem(FBKEY)||"null")||FB_PADRAO;}catch(e){return FB_PADRAO;}}
function carregarScript(src){return new Promise((ok,er)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=er;document.head.appendChild(s);});}
async function fbCarregar(){if(window.firebase&&firebase.firestore&&firebase.auth)return true;const b=`https://cdn.jsdelivr.net/npm/firebase@${FBV}/`;
  try{await carregarScript(b+"firebase-app-compat.js");await carregarScript(b+"firebase-auth-compat.js");await carregarScript(b+"firebase-firestore-compat.js");return true;}catch(e){return false;}}
function lerConfigTexto(t){const m=String(t||"").match(/\{[\s\S]*\}/);if(!m)return null;let o=null;
  try{o=JSON.parse(m[0]);}catch(e){try{o=JSON.parse(m[0].replace(/\/\/.*$/gm,"").replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}"));}catch(e2){}}

  try{await firebase.firestore().enablePersistence({synchronizeTabs:true});}catch(e){}

/* ---------- cálculos ---------- */
function calc(p){
  const recebido=p.pagamentos.reduce((a,x)=>a+(Number(x.valor)||0),0);
  const custo=p.materiais.reduce((a,m)=>a+(Number(m.qtd)||0)*(Number(m.preco)||0),0);
  let qtd=0,area=0,fita=0;
  p.pecas.forEach(pc=>{const q=Number(pc.qtd)||0,c=Number(pc.comp)||0,l=Number(pc.larg)||0;qtd+=q;area+=q*c*l/1e6;
    fita+=q*fitaPecaMm(pc)/1000;});
  const valor=Number(p.valor)||0;
  return {recebido,saldo:valor-recebido,custo,margem:valor-custo,qtd,area,fita};
}
function empacotar(itens,W,H,k,r,regra){
  const sheets=[],naoCabe=[];let area=0;
  const novaChapa=()=>{const s={free:[{x:r,y:r,w:W+k,h:H+k}],placed:[]};sheets.push(s);return s};
  const tentar=(it)=>{
    let best=null;
    sheets.forEach(s=>s.free.forEach((fr,fi)=>{
      const orients=[[it.w,it.h,false]]; if(!it.veio&&it.w!==it.h) orients.push([it.h,it.w,true]);
      orients.forEach(([w,h,rot])=>{const pw=w+k,ph=h+k;
        if(pw<=fr.w&&ph<=fr.h){const sc=Math.min(fr.w-pw,fr.h-ph),sc2=Math.max(fr.w-pw,fr.h-ph);
          if(!best||sc<best.sc||(sc===best.sc&&sc2<best.sc2)) best={s,fi,fr,w,h,pw,ph,rot,sc,sc2};}});
    }));
    return best;
  };
  itens.forEach(it=>{
    if(it.w<=0||it.h<=0)return;
    let b=tentar(it);
    if(!b){novaChapa();b=tentar(it);}
    if(!b){if(!sheets[sheets.length-1].placed.length)sheets.pop();naoCabe.push(it);return;}
    const {s,fi,fr,w,h,pw,ph,rot}=b;
    s.placed.push({x:fr.x,y:fr.y,w,h,nome:it.nome,rot,forma:it.forma,cortes:(fr.w-pw>k?1:0)+(fr.h-ph>k?1:0)});
    area+=w*h;
    s.free.splice(fi,1);
    const dw=fr.w-pw, dh=fr.h-ph; let a,c;
    if((dw<dh)!==(regra===1)){a={x:fr.x+pw,y:fr.y,w:dw,h:ph};c={x:fr.x,y:fr.y+ph,w:fr.w,h:dh};}
    else{a={x:fr.x+pw,y:fr.y,w:dw,h:fr.h};c={x:fr.x,y:fr.y+ph,w:pw,h:dh};}
    [a,c].forEach(z=>{if(z.w>k&&z.h>k)s.free.push(z)});
  });
  const last=sheets[sheets.length-1];
  const ultima=last?(W*H-last.placed.reduce((a,x)=>a+x.w*x.h,0)):0;
  return {sheets,naoCabe,area,ultima};
}
/* ---------- modos de corte ---------- */
const MODOS_CORTE={
  aproveitar:{nome:"Aproveitar mais",d:"Menos chapas e menos sobra. Encaixa as peças onde couber melhor."},
  facil:{nome:"Mais fácil de cortar",d:"Corta a chapa em faixas no comprimento e depois atravessa. Menos ajustes na serra."},
  sobra:{nome:"Sobra inteira",d:"Mesma quantidade de chapas, mas junta a sobra num pedaço grande para usar depois."}
};
function rngNum(seed){let h=(seed*2654435761)>>>0||1;return ()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};}
function maiorSobra(sheets,k){let b=null;sheets.forEach((s,i)=>(s.free||[]).forEach(z=>{const w=z.w-k,h=z.h-k;if(w>0&&h>0&&(!b||w*h>b.w*b.h))b={w:Math.round(w),h:Math.round(h),i};}));return b;}
function contarCortes(sheets){return sheets.reduce((a,s)=>a+s.placed.reduce((b,x)=>b+(x.cortes||0),0),0);}
function faixas(itens,W,H,k,r,ordem){
  const sheets=[],naoCabe=[];let area=0;
  const its=itens.map(it=>{let w=it.w,h=it.h,rot=false;if(!it.veio&&h>w){[w,h]=[h,w];rot=true;}return Object.assign({},it,{w,h,rot});});
  its.sort(ordem===1?((a,b)=>b.w-a.w||b.h-a.h):((a,b)=>b.h-a.h||b.w-a.w));
  const novaChapa=()=>{const s={placed:[],strips:[],usedH:0,free:[]};sheets.push(s);return s;};
  its.forEach(it=>{
    if((it.w>W||it.h>H)&&!(!it.veio&&it.h<=W&&it.w<=H)){naoCabe.push(it);return;}
    let best=null;
    sheets.forEach(s=>s.strips.forEach(st=>{if(st.h>=it.h&&st.used+it.w<=W+0.01){const sc=(st.h-it.h)*1000+(W-st.used-it.w)/1000;if(!best||sc<best.sc)best={s,st,sc};}}));
    if(best&&best.st.h-it.h>Math.max(60,it.h*0.25))best=null;
    let s,st;
    if(best){s=best.s;st=best.st;}
    else{s=sheets.find(x=>x.usedH+it.h<=H+0.01);if(!s){s=novaChapa();if(it.h>H){naoCabe.push(it);return;}}
      st={y:s.usedH,h:it.h,used:0};s.strips.push(st);s.usedH+=it.h+k;}
    const cortes=(st.used+it.w<W-1?1:0)+(st.h-it.h>1?1:0)+(st.used===0&&st.y+st.h<H-1?1:0);
    s.placed.push({x:r+st.used,y:r+st.y,w:it.w,h:it.h,nome:it.nome,rot:it.rot,forma:it.forma,cortes});
    st.used+=it.w+k;area+=it.w*it.h;
  });
  sheets.forEach(s=>{s.strips.forEach(st=>{if(W-st.used>k)s.free.push({x:r+st.used,y:r+st.y,w:W-st.used+k,h:st.h+k});});
    if(H-s.usedH>0)s.free.push({x:r,y:r+s.usedH,w:W+k,h:H-s.usedH+k});});
  const last=sheets[sheets.length-1];
  return {sheets,naoCabe,area,ultima:last?(W*H-last.placed.reduce((a,x)=>a+x.w*x.h,0)):0};
}
const _planoMemo=new Map();
function planejarModo(p,modo){
  const k=Math.max(0,Number(p.corte.kerf)||0),r=Math.max(0,Number(p.corte.refilo)||0),seed=Number(p.corte.seed)||1;
  const chave=JSON.stringify([modo,k,r,seed,p.chapas.map(c=>[c.id,c.comp,c.larg]),p.pecas.map(x=>[x.material,x.comp,x.larg,x.qtd,x.veio,x.nome,x.curva,x.curvaMm])]);
  if(_planoMemo.has(chave))return _planoMemo.get(chave);
  const out=p.chapas.map(ch=>({chapa:ch,sheets:[],naoCabe:[],area:0,cortes:0,sobra:null}));
  out.forEach(g=>{
    const ch=g.chapa,W=(Number(ch.comp)||0)-2*r,H=(Number(ch.larg)||0)-2*r;if(W<=0||H<=0)return;
    const itens=[];
    p.pecas.filter(pc=>pc.material===ch.id).forEach(pc=>{const q=Math.min(500,Math.max(0,Math.floor(Number(pc.qtd)||0)));
      for(let i=0;i<q;i++)itens.push({nome:(pc.nome||"Peça")+(pc.curva?" (curva)":""),w:Number(pc.comp)||0,h:Number(pc.larg)||0,veio:!!pc.veio,forma:pc.curva?{curva:pc.curva,curvaMm:pc.curvaMm,comp:pc.comp,larg:pc.larg}:null});});
    if(!itens.length)return;
    let cands=[];
    if(modo==="facil"){cands=[faixas(itens,W,H,k,r,0),faixas(itens,W,H,k,r,1)];}
    else{
      const ordens=[(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h,(a,b)=>b.w*b.h-a.w*a.h,(a,b)=>b.w-a.w||b.h-a.h,(a,b)=>b.h-a.h||b.w-a.w];
      ordens.forEach(o=>[0,1].forEach(rg=>cands.push(empacotar(itens.slice().sort(o),W,H,k,r,rg))));
      const R=rngNum(seed+itens.length),voltas=itens.length>150?10:itens.length>60?24:48;
      for(let t=0;t<voltas;t++){const arr=itens.slice().sort(ordens[t%4]);for(let i=0;i<arr.length;i++){if(R()<0.35){const j=Math.min(arr.length-1,i+1+Math.floor(R()*4));[arr[i],arr[j]]=[arr[j],arr[i]];}}
        cands.push(empacotar(arr,W,H,k,r,t%2));}
    }
    cands.forEach(c=>{c.cortes=contarCortes(c.sheets);c.sobra=maiorSobra(c.sheets,k);});
    const sArea=c=>c.sobra?c.sobra.w*c.sobra.h:0;
    cands.sort((a,b)=>(a.naoCabe.length-b.naoCabe.length)||(a.sheets.length-b.sheets.length)||
      (modo==="facil"?(a.cortes-b.cortes)||(b.ultima-a.ultima):modo==="sobra"?(sArea(b)-sArea(a))||(a.cortes-b.cortes):(b.ultima-a.ultima)||(a.cortes-b.cortes)));
    const m=cands[0];g.sheets=m.sheets;g.naoCabe=m.naoCabe;g.area=m.area;g.cortes=m.cortes;g.sobra=m.sobra;
  });
  if(_planoMemo.size>40)_planoMemo.clear();_planoMemo.set(chave,out);
  return out;
}
function resumoPlano(pl){const ch=pl.reduce((a,g)=>a+g.sheets.length,0),ar=pl.reduce((a,g)=>a+g.area,0),
  tot=pl.reduce((a,g)=>a+g.sheets.length*(Number(g.chapa.comp)||1)*(Number(g.chapa.larg)||1),0),cortes=pl.reduce((a,g)=>a+(g.cortes||0),0);
  let sb=null;pl.forEach(g=>{if(g.sobra&&(!sb||g.sobra.w*g.sobra.h>sb.w*sb.h))sb=g.sobra;});
  const fx=pl.reduce((a,g)=>a+g.sheets.reduce((b,s2)=>b+((s2.strips||[]).length),0),0);
  return {chapas:ch,aprov:tot?Math.round(ar/tot*100):0,cortes,sobra:sb,faixas:fx};}
function escolhaModos(p){
  const atual=p.corte.modo||"aproveitar";
  const res=Object.fromEntries(Object.keys(MODOS_CORTE).map(k=>[k,resumoPlano(planejarModo(p,k))]));
  const minCh=Math.min(...Object.values(res).map(x=>x.chapas));
  return `<section class="card section-gap"><h3>${icon("cut",18)}Como montar o plano</h3>
    <div class="modos">${Object.entries(MODOS_CORTE).map(([k,m])=>{const x=res[k];return `<button type="button" class="modo" data-modo="${k}" aria-pressed="${atual===k}">
      <span class="modo-h"><b>${m.nome}</b>${atual===k?`<span class="modo-ok">${icon("check",14)}</span>`:""}</span>
      <span class="modo-d">${m.d}</span>
      <span class="modo-n"><span><b class="m">${x.chapas}</b> chapa${x.chapas>1?"s":""}${x.chapas>minCh?` <em>+${x.chapas-minCh}</em>`:""}</span><span><b class="m">${x.aprov}%</b> aproveit.</span>${x.faixas?`<span>em <b class="m">${x.faixas}</b> faixas</span>`:""}${x.sobra?`<span>sobra <b class="m">${x.sobra.w}×${x.sobra.h}</b></span>`:""}</span></button>`;}).join("")}</div>
    ${atual!=="facil"?`<button class="btn wide section-gap" data-act="outroArranjo">${icon("wand",17)}Tentar outro arranjo</button>`:""}</section>`;
}
function planejar(p){return planejarModo(p,p.corte.modo||"aproveitar");}

function dias(prazo){return Math.round((new Date(prazo+"T12:00")-new Date(hoje()+"T12:00"))/864e5)}
function dueChip(p){
  if(p.status==="Entregue")return `<span class="due done">Entregue</span>`;
  if(!p.prazo)return "";
  const d=dias(p.prazo);
  if(d<0)return `<span class="due late">Atrasado ${-d} dia${d===-1?"":"s"}</span>`;
  if(d===0)return `<span class="due late">Entrega hoje</span>`;
  if(d===1)return `<span class="due soon">Entrega amanhã</span>`;
  return `<span class="due ${d<=7?"soon":""}">Em ${d} dias</span>`;
}
const iniciais=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?";
function waLink(t){const tel=String(t||"").replace(/\D/g,"");if(tel.length<8)return "";return "https://wa.me/"+(tel.length<=11?"55"+tel:tel);}
function mini(pc,box=40){
  const c=Number(pc.comp)||1,l=Number(pc.larg)||1,sc=box/Math.max(c,l),w=Math.max(6,c*sc),h=Math.max(6,l*sc),x=(box-w)/2,y=(box-h)/2,f=pc.fita||{};
  if(pc.curva&&+pc.comp&&+pc.larg){const pts=contornoPeca(pc);const d="M"+pts.map(q=>(x+q[0]*sc).toFixed(1)+" "+(y+q[1]*sc).toFixed(1)).join(" L")+" Z";
    return `<svg width="${box}" height="${box}" viewBox="-2 -2 ${box+4} ${box+4}" aria-hidden="true"><path d="${d}" fill="var(--piece)" stroke="var(--muted)" stroke-width="1.2"/></svg>`;}
  const e=(on,x1,y1,x2,y2)=>on?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tape)" stroke-width="3.5" stroke-linecap="round"/>`:"";
  return `<svg width="${box}" height="${box}" viewBox="-2 -2 ${box+4} ${box+4}" aria-hidden="true"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--piece)" stroke="var(--muted)" stroke-width="1.2" rx="1"/>
  ${e(f.c1,x,y,x+w,y)}${e(f.c2,x,y+h,x+w,y+h)}${e(f.l1,x,y,x,y+h)}${e(f.l2,x+w,y,x+w,y+h)}</svg>`;
}

function render(){
  const nav=document.getElementById("bnav");
  nav.hidden=S.view==="projeto"||S.view==="inicio";
  nav.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current",b.dataset.nav===S.view?"page":"false"));
  let html;
  if(S.view==="inicio")html=vInicio();
  else if(S.view==="clientes")html=vClientes();
  else if(S.view==="projeto"&&S.projetos.has(S.atual))html=vProjeto();
  else{S.view="lista";html=vLista();}
  app.innerHTML=html;app.className="v-"+S.view+(S.view==="projeto"?" a-"+S.aba:"");
  atualizarCalc();
  if(S.view==="projeto"&&S.aba==="movel"&&S.vista!=="frente")montar3D();else liberar3D();
}
function ordenados(){
  return [...S.projetos.entries()].sort((a,b)=>{
    const ea=a[1].status==="Entregue",eb=b[1].status==="Entregue";if(ea!==eb)return ea?1:-1;
    return (a[1].prazo||"9999").localeCompare(b[1].prazo||"9999")||(b[1].atualizado-a[1].atualizado);
  });
}

  <input type="file" id="backup-in" accept=".json,application/json" hidden></section>`;}
async function salvarArquivo(nome,blob){
  if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use("downloads");}catch(e){}
    if(dl){try{await dl.save({filename:nome,data:blob});return true;}catch(e){if(e&&e.code==="declined")return false;if(e&&e.code==="rate_limited"){toast("Aguarde um instante e tente de novo.");return false;}}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;}
function htmlDoApp(){
  const d=document.documentElement.cloneNode(true);
  d.querySelectorAll("script").forEach(sc=>{const src=sc.getAttribute("src")||"";
    const fica=/cdnjs\.cloudflare\.com\/ajax\/libs\/(jspdf|three\.js)\//.test(src)||(!src&&sc.textContent.includes("function htmlDoApp"));if(!fica)sc.remove();});
  d.querySelectorAll("style").forEach(st=>{if(!st.textContent.includes("--tape"))st.remove();});
  d.querySelectorAll("link").forEach(l=>{if(!/fonts\.(googleapis|gstatic)\.com/.test(l.getAttribute("href")||""))l.remove();});
  const app=d.querySelector("#app");if(app)app.innerHTML="";
  const dg=d.querySelector("#dlg");if(dg){dg.removeAttribute("open");const c=dg.querySelector("#dlg-c");if(c)c.innerHTML="";}
  const t=d.querySelector("#toast");if(t){t.textContent="";t.className="toast";}
  const b=d.querySelector("body");if(b)[...b.children].forEach(el=>{if(!["app","dlg","toast"].includes(el.id)&&el.tagName!=="SCRIPT"&&!el.matches("nav, .bottomnav"))el.remove();});
  return "<!DOCTYPE html>\n"+d.outerHTML;}
async function baixarApp(){
  try{const ok=await salvarArquivo("ef-moveis-e-planejados.html",new Blob([htmlDoApp()],{type:"text/html"}));
    if(ok)toast("App baixado. Abra o arquivo no computador com dois cliques.");}
  catch(e){toast("Não foi possível baixar o app.");}}
async function backupSalvar(){const o={};S.projetos.forEach((v,k)=>o[k]=v);
  const blob=new Blob([JSON.stringify({app:"ef-moveis",versao:1,data:new Date().toISOString(),projetos:o},null,1)],{type:"application/json"});
  if(await salvarArquivo(`backup-ef-moveis-${hoje()}.json`,blob))toast(`Backup com ${S.projetos.size} projeto${S.projetos.size===1?"":"s"} salvo.`);}
function backupRestaurar(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);const o=d&&d.projetos?d.projetos:d;let n=0;
    Object.entries(o||{}).forEach(([k,v])=>{if(v&&typeof v==="object"&&Array.isArray(v.pecas)){S.projetos.set(k,normalizar(v));n++;}});
    if(!n){toast("Esse arquivo não parece um backup do app.");return;}
    numerarOS();S.projetos.forEach((v,k)=>salvar(k));render();toast(`${n} projeto${n===1?"":"s"} restaurado${n===1?"":"s"}.`);}
  catch(e){toast("Não consegui ler o arquivo de backup.");}};fr.readAsText(file);}

function atualizarCalc(){

  const p=S.projetos.get(S.atual);if(!p||S.view!=="projeto")return;const c=calc(p),v=Number(p.valor)||0;
  app.querySelectorAll("[data-calc]").forEach(el=>{const k=el.dataset.calc;
    if(k==="pct"){el.style.width=(v?Math.min(100,c.recebido/v*100):0)+"%";return;}
    const val={recebido:brl(c.recebido),saldo:brl(Math.max(0,c.saldo)),custo:brl(c.custo),margem:brl(c.margem),qtd:String(c.qtd),area:n2(c.area)+" m²",fita:n2(c.fita)+" m",

function fitaBox(d){

  return `<div class="fitarect" style="aspect-ratio:${ar}"><div class="dimt">${c||"?"} × ${l||"?"}<small>mm</small></div>
    ${e("c1","t","Fita no comprimento, lado 1")}${e("c2","b","Fita no comprimento, lado 2")}${e("l1","l","Fita na largura, lado 1")}${e("l2","r","Fita na largura, lado 2")}</div>`;

function svgFormaPeca(d){const W=+d.comp||0,D=+d.larg||0;if(!W||!D)return `<p class="as-note" style="margin:0;color:var(--muted)">Informe as medidas para ver o formato.</p>`;

function salvarPeca(outra){

function fatorUn(u,padrao){u=(u||"").toLowerCase();if(!u)u=padrao;if(u.startsWith("mm")||u.startsWith("mil"))return 1;if(u.startsWith("c"))return 10;if(u==="m"||u.startsWith("metro"))return 1000;return 1;}
function parseTexto(txt,p){

      const vm=s.match(/(?:barriga|curva|raio|arredondad[oa]s?|c[ôo]ncava)\s*(?:de\s*|com\s*)?(\d+(?:[.,]\d+)?)\s*(mm|cm)?/);

      else it.curvaMm=it.curva==="redonda"?0:50;}

    const esp=s.match(/(\d{1,2})\s*(?:mm|mil)/);if(esp&&!it.esp)it.esp=Number(esp[1]);
    let q=s.match(/(\d+)\s*(?:unidades?|un\b|p[çc]s\b|pe[çc]as?|vezes|x\b)/);
    if(q){it.qtd=Number(q[1]);it.temQtd=true;s=s.replace(q[0]," ");}
    else{const w=s.match(/\b(\w+)\s+(?:unidades?|pe[çc]as?)\b/);

      else{const d=s.match(/(?:^|\s)(\d+)(?=\s)/);

    else toast("Não consegui montar agora. Tente de novo ou escreva as medidas.");
  }
  atualizarAssist();
}

function contornoRet(W,D,r){r=Math.max(0,Math.min(r||0,W/2,D/2));const pts=[],N=10;

function contornoElipse(W,D){const pts=[],N=64;for(let i=0;i<N;i++){const a=i/N*Math.PI*2;pts.push([W/2+W/2*Math.cos(a),D/2+D/2*Math.sin(a)]);}return pts;}
function perimElipse(W,D){const a=W/2,b=D/2;return Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)));}

/* fita de uma peça (em mm, por unidade) levando a curva em conta */
function fitaPecaMm(pc){const c=+pc.comp||0,l=+pc.larg||0,f=pc.fita||{},v=+pc.curvaMm||0;

function modeloMesa(m){

  const f=m.formato||"reto",raio=Math.max(0,+m.raio||0),metal=m.pes!=="madeira",ps=metal?50:70;
  const tampo={nome:"Tampo",cat:"caixa",x:0,y:H-th,z:0,w:W,h:th,d:D};

  else{const i=Math.max(60,raio*0.35+40);pos=[[i,i],[W-i-ps,i],[W-i-ps,D-i-ps],[i,D-i-ps]];}
  pos.forEach(([x,z])=>parts.push({nome:"Pé",cat:metal?"metal":"caixa",x,y:0,z,w:ps,h:H-th,d:ps}));

  const curva=f==="cantos"?{curva:"cantos4",curvaMm:raio}:f==="redonda"?{curva:"redonda",curvaMm:0}:{};
  lista.push(Object.assign({nome:m.dupla?"Tampo (2 chapas coladas)":"Tampo",qtd:m.dupla?2:1,comp:Math.round(W),larg:Math.round(D),fita:m.dupla?"":"c1c2l1l2",fundo:false},curva));
  if(m.dupla){const per=f==="redonda"?perimElipse(W,D):f==="cantos"?2*(W+D)-8*Math.min(raio,W/2,D/2)+2*Math.PI*Math.min(raio,W/2,D/2):2*(W+D);
    ferr.push([`Fita de borda ${th<=35?35:45} mm${f!=="reto"?" flexível":""} para o tampo (metros)`,Math.ceil(per*1.1/100)/10]);ferr.push(["Cola de madeira (PVA)",1]);}
  if(metal)ferr.push([`Pé de mesa metálico ${Math.round(H-th)} mm, cor ${((CORES_METAL.find(c=>c[1]===m.corMetal)||["preto"])[0]).toLowerCase()}`,4]);
  else{lista.push({nome:"Pé – tira larga",qtd:8,comp:Math.round(H-th),larg:ps,fita:"",fundo:false});lista.push({nome:"Pé – tira estreita",qtd:8,comp:Math.round(H-th),larg:ps-2*e,fita:"",fundo:false});
    ferr.push(["Cola de madeira (PVA) para os pés",1]);}

  if(W>1800&&!saia)avisos.push("Mesa longa sem saia pode envergar. Ligue a saia ou engrosse o tampo.");

/* ---------- painel (TV, ripado, cabeceira) ---------- */

  const zR=m.fundoPainel!==false?e:0;

    lista.push({nome:"Ripa",qtd:n,comp:Math.round(H),larg:Math.round(rw),fita:"l1l2",fundo:false});
    ferr.push(["Cola PU ou cola de contato (tubo)",Math.max(1,Math.ceil(n/12))]);ferr.push(["Pino ou prego sem cabeça (caixa)",1]);
    if(H>2750)avisos.push("Ripa maior que a chapa: vai ter emenda.");}
  if(m.fundoPainel!==false)lista.push({nome:"Painel",qtd:nH*nV,comp:Math.round(W/nH),larg:Math.round(H/nV),fita:"",fundo:false});
  if(m.tv){const tw=Math.min(W*0.72,1450),th=tw*0.5625,zT=zR+(m.ripado?e:0);parts.push({nome:"TV",cat:"puxador",x:m0+(W-tw)/2,y:y0+Math.max(40,(H-th)*0.55),z:zT,w:tw,h:th,d:30});}

  return {parts,lista,avisos,ferragens:ferr,e,W:W+2*m0,H:Hw,D:(m.nicho?300:e*2),dimW:{x0:m0,x1:m0+W,label:`${Math.round(W)} mm`},dimH:{y0:y0,y1:y0+H,label:`${Math.round(H)} mm`}};

/* Gera as partes (posição 3D) e a lista de corte */

  mats.frente=mats.porta;

  const pdC=m.acabCaixa&&PAD[m.acabCaixa],pdF=m.acabFrente&&PAD[m.acabFrente];

function normParse(r,tipo){
  r=Object.assign({},r);
  if(tipo==="prateleira"||tipo==="tampo"||tipo==="canto"){
    if(r.prateleiras!=null&&r.qtd==null)r.qtd=r.prateleiras;delete r.prateleiras;
    if(r.qtd!=null)r.qtd=Math.max(1,r.qtd);
    if(r.larg!=null&&r.alt!=null&&r.prof!=null){const t=r.prof;r.prof=r.alt;if(t<=50)r.esp=t;}
    else if(r.alt!=null&&r.prof==null)r.prof=r.alt;
    delete r.alt;
  }else if(tipo==="cama"){
    if(r._p2!=null&&r.prof==null){r.prof=r._p2;if(!r._lab_alt)delete r.alt;}
    if(r._tamL&&r.larg==null){r.larg=r._tamL;r.prof=r._tamC;}
    delete r.qtd;delete r.prateleiras;delete r.curva;
  }else if(tipo==="mesa"||tipo==="escrivaninha"||tipo==="suspensa"){
    if(r.larg!=null&&r.alt!=null&&r.prof!=null&&r._p2==null&&!r._lab_alt&&!r._lab_prof){const a=r.alt;r.alt=r.prof;r.prof=a;}
    else if(r._p2!=null&&r.prof==null){r.prof=r._p2;if(!r._lab_alt)delete r.alt;}
    delete r.qtd;delete r.curva;delete r.flecha;
  }else delete r.qtd;
  Object.keys(r).forEach(k=>{if(k[0]==="_")delete r[k];});
  return r;
}

async function exportarPDF(tipo){
  const p=S.projetos.get(S.atual);if(!p)return;
  if(!window.jspdf){toast("O gerador de PDF não carregou. Confira a internet e recarregue.");return;}
  let doc;try{doc=gerarPDF(p,tipo);}catch(e){toast("Não foi possível montar o PDF.");return;}
  const base=(p.nome||"projeto").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"projeto";
  const nome=`${fmtOS(p.os).replace(" ","-").toLowerCase()}-${base}${tipo==="cliente"?"-cliente":"-completo"}.pdf`;
  fecharDlg();
  if(!window.claude){doc.save(nome);return;}
  let dl=null;try{dl=await window.claude.use("downloads");}catch(e){}
  if(!dl){toast("Download indisponível nesta tela.");return;}
  try{await dl.save({filename:nome,data:doc.output("blob")});toast("PDF salvo");}
  catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Aguarde um instante e tente de novo.");return;}toast("Não foi possível salvar o PDF.");}
}

    case "tirarMovel":garantirId(p);{const id=p.movel&&p.movel.id;p.pecas=p.pecas.filter(x=>!(x.origem==="movel"&&x.movelId===id));}p.movel=null;salvar(S.atual);redesenhar();toast("Escolha o novo móvel.");break;
    case "ferrLista":{const r=modelo(p.movel);r.ferragens.forEach(([n,q])=>{const ex=p.materiais.find(m=>m.item===n);if(ex)ex.qtd=q;else p.materiais.push({id:uid(),item:n,qtd:q,preco:0});});
      planejar(p).forEach(g=>{if(!g.sheets.length)return;const nome=`Chapa ${g.chapa.nome}`;const ex=p.materiais.find(m=>m.item===nome);if(ex)ex.qtd=g.sheets.length;else p.materiais.unshift({id:uid(),item:nome,qtd:g.sheets.length,preco:0});});
      const f=calc(p).fita;if(f){const q=Math.ceil(f*1.1);const ex=p.materiais.find(m=>m.item==="Fita de borda (m)");if(ex)ex.qtd=q;else p.materiais.push({id:uid(),item:"Fita de borda (m)",qtd:q,preco:0});}
      salvar(S.atual);S.aba="materiais";render();window.scrollTo(0,0);toast("Chapas, fita e ferragens na lista. Coloque os preços.");break;}
    case "maisPecas":S.aba="pecas";render();window.scrollTo(0,0);setTimeout(()=>{const t=document.getElementById("assist");if(t)t.focus()},60);break;
    case "assistIA":assistIA();break;
    case "assistCancel":if(S.assist.ctl)try{S.assist.ctl.abort()}catch(_){}S.assist.carregando=false;atualizarAssist();break;
    case "assistLimpar":S.assist.ia=null;S.assist.nota="";atualizarAssist();break;
    case "voltar":S.view="lista";render();window.scrollTo(0,0);break;
    case "inicio":S.view="inicio";render();window.scrollTo(0,0);break;
    case "addPag":{const inp=document.getElementById("novoPag");const v=parseNum(inp&&inp.value);if(!v){toast("Digite o valor recebido");inp&&inp.focus();return;}
      p.pagamentos.push({id:uid(),data:hoje(),valor:v});salvar(S.atual);redesenhar();toast("Pagamento registrado");break;}
    case "novaPeca":abrirPeca(null);break;
    case "salvarPeca":salvarPeca(false);break;
    case "salvarPecaNova":salvarPeca(true);break;
    case "dupPeca":{const o=p.pecas.find(x=>x.id===S.draft.id);if(!o)return;const c=clone(S.draft);c.id=uid();p.pecas.splice(p.pecas.indexOf(o)+1,0,c);salvar(S.atual);render();fecharDlg();toast("Peça duplicada");break;}
    case "delPeca":p.pecas=p.pecas.filter(x=>x.id!==S.draft.id);salvar(S.atual);render();fecharDlg();toast("Peça excluída");break;
    case "novoMat":abrirMat(null);break;
    case "salvarMat":salvarMat(false);break;
    case "salvarMatNovo":salvarMat(true);break;
    case "delMat":p.materiais=p.materiais.filter(x=>x.id!==S.mdraft.id);salvar(S.atual);render();fecharDlg();toast("Item excluído");break;
    case "ajustarChapa":folhaChapa();break;
    case "addChapa":p.chapas.push({id:uid(),nome:"MDF Cor 15mm",comp:2750,larg:1840});salvar(S.atual);folhaChapa();break;
    case "importar":{
      planejar(p).forEach(g=>{if(!g.sheets.length)return;const nome=`Chapa ${g.chapa.nome}`;const ex=p.materiais.find(m=>m.item===nome);
        if(ex)ex.qtd=g.sheets.length;else p.materiais.unshift({id:uid(),item:nome,qtd:g.sheets.length,preco:0});});
      const f=calc(p).fita;if(f){const q=Math.ceil(f*1.1);const ex=p.materiais.find(m=>m.item==="Fita de borda (m)");if(ex)ex.qtd=q;else p.materiais.push({id:uid(),item:"Fita de borda (m)",qtd:q,preco:0});}
      salvar(S.atual);redesenhar();toast("Lista atualizada. Toque nos itens para pôr o preço.");break;}
    case "exportar":dlgExportar();break;
    case "backupSalvar":backupSalvar();break;
    case "baixarApp":baixarApp();break;
    case "nuvem":dlgNuvem();break;
    case "fbReligar":localStorage.removeItem(FBKEY+"-off");location.reload();break;
    case "fbSalvarCfg":case "fbEntrar":case "fbCriar":case "fbSair":case "fbEsquecer":fbAcao(a);break;
    case "backupAbrir":{const i=document.getElementById("backup-in");if(i){i.value="";i.click();}break;}
    case "outroArranjo":{const antes=resumoPlano(planejar(p));p.corte.seed=(Number(p.corte.seed)||1)+1;const dep=resumoPlano(planejar(p));salvar(S.atual);const o=document.getElementById("corte-out");if(o)o.innerHTML=vPlano(p);
      toast(dep.chapas<antes.chapas?"Achei um arranjo com menos chapas.":dep.aprov>antes.aprov?"Arranjo novo, com melhor aproveitamento.":"Arranjo novo. Se preferir o anterior, toque de novo.");break;}
    case "enviar":dlgEnviar();break;
    case "enviarPDF":enviarPDF();break;
    case "copiarResumo":dlgTexto("Resumo para o cliente",textoCliente(p));break;
    case "mvSalvar":if(p.movel){garantirId(p);p.moveis.push(p.movel);p.movel=null;S.mvtxt="";salvar(S.atual);render();window.scrollTo(0,0);toast("Móvel salvo no projeto. Escolha o próximo.");}break;
    case "fechar":fecharDlg();break;
    case "copiar":copiar();break;
    case "excluir":
      if(!S.confirmDel){S.confirmDel=true;redesenhar();setTimeout(()=>{if(S.confirmDel){S.confirmDel=false;if(S.view==="projeto"&&S.aba==="resumo")redesenhar();}},4000);}
      else{const id=S.atual;S.confirmDel=false;S.view="lista";excluir(id);render();toast("Projeto excluído");}
      break;
  }
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=S.projetos.get(S.atual);
  if(b.dataset.nav){S.view=b.dataset.nav;render();window.scrollTo(0,0);return;}
  if(b.dataset.filtro){S.filtro=b.dataset.filtro;render();return;}
  if(b.dataset.abrir){abrir(b.dataset.abrir);return;}
  if(b.dataset.aba){S.aba=b.dataset.aba;S.confirmDel=false;const y=Math.min(window.scrollY,app.querySelector(".ptabs")?app.querySelector(".ptabs").offsetTop-60:0);render();window.scrollTo(0,Math.max(0,y));return;}
  if(b.dataset.status&&p){p.status=b.dataset.status;salvar(S.atual);redesenhar();return;}
  if(b.dataset.peca){abrirPeca(b.dataset.peca);return;}
  if(b.dataset.preset&&p){p.movel=novoMovel(b.dataset.preset,p);aplicarMovel(p);salvar(S.atual);S.vista="3d";render();window.scrollTo(0,0);return;}
  if(b.dataset.tipo&&p&&p.movel){const o=p.movel;const m=novoMovel(b.dataset.tipo,p);m.corCaixa=o.corCaixa;m.corFrente=o.corFrente;m.esp=o.esp;m.id=o.id;p.movel=m;aplicarMovel(p);salvar(S.atual);redesenhar();return;}
  if(b.dataset.mvs&&p&&p.movel){const k=b.dataset.mvs;const lim=(p.movel.tipo==="escrivaninha"&&k==="gavetas")?3:(p.movel.tipo==="suspensa"&&k==="prateleiras")?5:{portas:8,gavetas:12,prateleiras:20,divisoes:8,qtd:200}[k];p.movel[k]=Math.max(k==="qtd"?1:0,Math.min(lim,(p.movel[k]||0)+Number(b.dataset.dd)));aplicarMovel(p);salvar(S.atual);redesenhar();return;}
  if(b.dataset.padrao&&p&&p.movel){dlgPadrao(b.dataset.padrao);return;}
  if(b.dataset.padgrp){S.padGrp=b.dataset.padgrp;const st=dlgC.scrollTop;dlgPadrao(S.padK);dlgC.scrollTop=0;return;}
  if(b.dataset.setpad){aplicarPadrao(b.dataset.setpad);return;}
  if(b.dataset.cor&&p&&p.movel){p.movel[b.dataset.cor]=b.dataset.c;salvar(S.atual);app.querySelectorAll(`[data-cor="${b.dataset.cor}"]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===b.dataset.c));atualizarVista();return;}
  if(b.dataset.mved&&p){garantirId(p);const i=p.moveis.findIndex(m=>m.id===b.dataset.mved);if(i>=0){const m=p.moveis.splice(i,1)[0];if(p.movel)p.moveis.push(p.movel);p.movel=m;S.vista="3d";S.confirmMv=null;salvar(S.atual);render();window.scrollTo(0,0);}return;}
  if(b.dataset.mvrm&&p){const id=b.dataset.mvrm;if(S.confirmMv!==id){S.confirmMv=id;redesenhar();return;}S.confirmMv=null;p.moveis=(p.moveis||[]).filter(m=>m.id!==id);p.pecas=p.pecas.filter(x=>x.movelId!==id);salvar(S.atual);redesenhar();toast("Móvel removido.");return;}
  if(b.dataset.modo&&p){p.corte.modo=b.dataset.modo;salvar(S.atual);const o=document.getElementById("corte-out");if(o)o.innerHTML=vPlano(p);toast(MODOS_CORTE[b.dataset.modo].nome);return;}
  if(b.dataset.htfit&&p&&p.movel){const m=p.movel,k=b.dataset.htfit;
    if(k==="painel")m.painelLarg=+m.larg;else if(k==="rack")m.larg=+m.painelLarg||+m.larg;
    else if(k==="chao"){const topo=(m.painelChao==null||m.painelChao===""?(+m.peAlt||170):+m.painelChao)+(+m.painelAlt||((+m.alt||2200)-(+m.peAlt||170)));m.painelChao=0;m.painelAlt=topo;}
    aplicarMovel(p);salvar(S.atual);redesenhar();toast("Medidas ajustadas.");return;}
  if(b.dataset.mvsize&&p&&p.movel){const [l,c]=b.dataset.mvsize.split("x").map(Number);p.movel.larg=l;p.movel.prof=c;aplicarMovel(p);salvar(S.atual);redesenhar();return;}
  if(b.dataset.mvopt&&p&&p.movel){p.movel[b.dataset.mvopt]=b.dataset.v;aplicarMovel(p);salvar(S.atual);redesenhar();return;}
  if(b.dataset.vista){S.vista=b.dataset.vista;redesenhar();return;}
  if(b.dataset.ang){S.ang=Object.assign(S.ang||{dist:1},{frente:{th:0,ph:0.06},"34":{th:-0.55,ph:0.28},lado:{th:-1.35,ph:0.14}}[b.dataset.ang]);if(V&&V.draw)V.draw();return;}
  if(b.dataset.mvex){S.mvtxt=b.dataset.mvex;const t=document.getElementById("mvtxt");if(t)t.value=S.mvtxt;const o=document.getElementById("mv-out");if(o)o.innerHTML=vMovelOut(p);return;}
  if(b.dataset.un){S.un=b.dataset.un;try{localStorage.setItem("bancada-unidade",S.un)}catch(_){}S.assist.ia=null;document.querySelectorAll("[data-un]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.un===S.un));const tip=document.querySelector(".as-tip b");if(tip)tip.textContent=S.un;atualizarAssist();return;}
  if(b.dataset.ex){S.assist.texto=b.dataset.ex;S.assist.ia=null;const t=document.getElementById("assist");if(t){t.value=b.dataset.ex;}if(/nicho|arm[aá]rio|gaveteiro|estante|rack|balc/i.test(b.dataset.ex)&&S.sample){atualizarAssist();assistIA();}else atualizarAssist();return;}
  if(b.dataset.rmai&&S.assist.ia){S.assist.ia.splice(Number(b.dataset.rmai),1);if(!S.assist.ia.length)S.assist.ia=null;atualizarAssist();return;}
  if(b.dataset.mat){abrirMat(b.dataset.mat);return;}
  if(b.dataset.chip&&S.draft){S.draft.nome=b.dataset.chip;const i=dlgC.querySelector('[data-d="nome"]');i.value=b.dataset.chip;dlgC.querySelector('[data-d="comp"]').focus();return;}
  if(b.dataset.mchip&&S.mdraft){S.mdraft.item=b.dataset.mchip;dlgC.querySelector('[data-md="item"]').value=b.dataset.mchip;dlgC.querySelector('[data-md="preco"]').focus();return;}
  if(b.dataset.qtd&&S.draft){S.draft.qtd=Math.max(1,(Number(S.draft.qtd)||0)+Number(b.dataset.qtd));dlgC.querySelector('[data-d="qtd"]').value=S.draft.qtd;return;}
  if(b.dataset.mqtd&&S.mdraft){S.mdraft.qtd=Math.max(0,(Number(S.mdraft.qtd)||0)+Number(b.dataset.mqtd));dlgC.querySelector('[data-md="qtd"]').value=showNum(S.mdraft.qtd)||"0";return;}
  if(b.dataset.edge&&S.draft){S.draft.fita=S.draft.fita||{};S.draft.fita[b.dataset.edge]=!S.draft.fita[b.dataset.edge];b.classList.toggle("on",S.draft.fita[b.dataset.edge]);b.setAttribute("aria-pressed",S.draft.fita[b.dataset.edge]);return;}
  if(b.dataset.dcurva!==undefined&&S.draft){S.draft.curva=b.dataset.dcurva;if(S.draft.curva&&S.draft.curva!=="redonda"&&S.draft.curva!=="canto"&&!(+S.draft.curvaMm))S.draft.curvaMm=50;const st=dlgC.scrollTop;folhaPeca();dlgC.scrollTop=st;return;}
  if(b.dataset.fita&&S.draft){const v=b.dataset.fita==="todas";S.draft.fita={c1:v,c2:v,l1:v,l2:v};document.getElementById("fitabox").innerHTML=fitaBox(S.draft);return;}
  if(b.dataset.delchapa&&p){if(p.chapas.length<2)return;p.chapas=p.chapas.filter(c=>c.id!==b.dataset.delchapa);p.pecas.forEach(pc=>{if(!p.chapas.find(c=>c.id===pc.material))pc.material=p.chapas[0].id});salvar(S.atual);folhaChapa();return;}
  if(b.dataset.del&&p){p[b.dataset.del]=p[b.dataset.del].filter(x=>x.id!==b.dataset.i);salvar(S.atual);redesenhar();return;}
  if(b.dataset.pdf){exportarPDF(b.dataset.pdf);return;}
  if(b.dataset.txt&&p){b.dataset.txt==="corte"?dlgTexto("Lista de corte",textoCorte(p)):dlgTexto("Lista de compras",textoMat(p));return;}
  if(b.dataset.act)acao(b.dataset.act);
});
